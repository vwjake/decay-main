name: Deploy to staging

on:
  push:
    branches: [master]
  # Lets the deploy be triggered by hand from the Actions tab, without a
  # push — useful for redeploying or confirming the pipeline works.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /opt/decay-main/deploy.sh
