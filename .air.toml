root = "."
tmp_dir = "tmp"

[build]
  pre_cmd = ["templ generate"]
  cmd = "go build -o ./tmp/main.exe ."
  bin = "./tmp/main.exe"
  entrypoint = ["./tmp/main.exe"]
  include_ext = ["go", "templ", "css", "js"]
  exclude_dir = ["tmp", "uploads", ".git"]
  exclude_regex = ["_templ\\.go$"]
  exclude_unchanged = false
  delay = 200
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"
  log = "build-errors.log"

[log]
  time = true

[misc]
  clean_on_exit = true
